name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14.9.0

      - name: Write service account key to file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_NEBULA }}' > "${{ github.workspace }}/firebase-key.json"

      - name: Set GOOGLE_APPLICATION_CREDENTIALS
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/firebase-key.json" >> $GITHUB_ENV

      - name: Deploy to Firebase
        run: firebase deploy --only hosting --project bot-nebula --debug
